<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Concept 1: The Faceted Waypoint (Compass Rose with Central Void) -->
  <g transform="translate(0, 0)">
    <!-- North Arm -->
    <polygon points="50,14 41,39 50,42" fill="#1E2229" opacity="0.9" />
    <polygon points="50,14 50,42 59,39" fill="#D94E36" />
    
    <!-- East Arm -->
    <polygon points="86,50 61,41 58,50" fill="#1E2229" opacity="0.75" />
    <polygon points="86,50 58,50 61,59" fill="#1E2229" opacity="0.9" />
    
    <!-- South Arm -->
    <polygon points="50,86 59,61 50,58" fill="#1E2229" opacity="0.65" />
    <polygon points="50,86 50,58 41,61" fill="#1E2229" opacity="0.8" />
    
    <!-- West Arm -->
    <polygon points="14,50 39,59 42,50" fill="#1E2229" opacity="0.75" />
    <polygon points="14,50 42,50 39,41" fill="#1E2229" opacity="0.9" />
    
    <!-- Secondary Diagonal Accents -->
    <circle cx="50" cy="50" r="14" fill="none" stroke="#1E2229" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.4" />
    
    <!-- Central Aperture Ring & Waypoint -->
    <circle cx="50" cy="50" r="6" fill="#FCFBFA" stroke="#1E2229" stroke-width="2.5" />
    <circle cx="50" cy="50" r="2.5" fill="#D94E36" />
  </g>
</svg>
