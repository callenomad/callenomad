<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Concept 6C: The Faceted Needle Monogram (3D Explorer Compass Blade) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- The 'Calle' Arc C -->
    <path 
      d="M 69 32 
         A 29 29 0 1 0 69 72" 
      fill="none" 
      stroke="#1E2229" 
      stroke-width="4.2" 
    />
    
    <!-- 3D Faceted Needle -->
    <!-- Forward Sunny Facet (Terracotta Coral) -->
    <polygon points="80,20 54,58 48,52" fill="#D94E36" />
    <!-- Forward Shadow Facet (Deep Charcoal) -->
    <polygon points="80,20 48,52 42,46" fill="#1E2229" />
    
    <!-- Tail Right Facet (Charcoal Midtone) -->
    <polygon points="24,76 48,52 54,58" fill="#1E2229" opacity="0.8" />
    <!-- Tail Left Facet (Charcoal Shadow) -->
    <polygon points="24,76 42,46 48,52" fill="#1E2229" opacity="0.6" />
    
    <!-- Central Pivot Pin -->
    <circle cx="48" cy="52" r="4.5" fill="#FCFBFA" stroke="#1E2229" stroke-width="2" />
    <circle cx="48" cy="52" r="1.8" fill="#D94E36" />
  </g>
</svg>
