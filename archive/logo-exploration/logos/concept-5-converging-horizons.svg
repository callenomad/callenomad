<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Concept 5: The Converging Horizons (The Immersion Bridge) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Nomad Journey Arc (Descending West to Center) -->
    <path 
      d="M 22 72 
         C 22 42, 42 24, 68 24" 
      fill="none" 
      stroke="#1E2229" 
      stroke-width="3.5" 
    />
    
    <!-- Street & Local Culture Arc (Ascending East to Center) -->
    <path 
      d="M 78 28 
         C 78 58, 58 76, 32 76" 
      fill="none" 
      stroke="#1E2229" 
      stroke-width="3.5" 
      opacity="0.85"
    />
    
    <!-- Converging Bridge Axis -->
    <line x1="36" y1="64" x2="64" y2="36" stroke="#D94E36" stroke-width="2.5" stroke-dasharray="3 3" />
    
    <!-- Left Anchor (Nomad) -->
    <circle cx="22" cy="72" r="3.5" fill="#1E2229" />
    
    <!-- Right Anchor (Street) -->
    <circle cx="78" cy="28" r="3.5" fill="#1E2229" />
    
    <!-- Central Connection Point (Fluency Exchange) -->
    <circle cx="50" cy="50" r="7" fill="#FCFBFA" stroke="#1E2229" stroke-width="2.5" />
    <circle cx="50" cy="50" r="3.5" fill="#D94E36" />
  </g>
</svg>
