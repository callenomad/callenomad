<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Concept 6A (Refined Master): The Precision Waypoint Monogram -->
  <!-- Optically counterbalanced at (48, 52) with symmetric 45° needle -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- The 'Calle' Arc C -->
    <path 
      d="M 69 33 
         A 29 29 0 1 0 69 71" 
      fill="none" 
      stroke="#1E2229" 
      stroke-width="4.2" 
    />
    
    <!-- Southwest Needle Tail (Charcoal) -->
    <line x1="30" y1="70" x2="43.5" y2="56.5" stroke="#1E2229" stroke-width="3.5" />
    
    <!-- Central Pivot Waypoint Ring -->
    <circle cx="48" cy="52" r="5.5" fill="#FCFBFA" stroke="#1E2229" stroke-width="2.5" />
    <circle cx="48" cy="52" r="2.2" fill="#D94E36" />
    
    <!-- Northeast Needle Shaft (Terracotta) -->
    <line x1="52.5" y1="47.5" x2="71" y2="29" stroke="#D94E36" stroke-width="3.5" />
    
    <!-- Mathematically Symmetric Arrowhead (45° Axis) -->
    <polygon points="80,20 64,25.5 74.5,36" fill="#D94E36" />
  </g>
</svg>
