<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Concept 4: The Cobblestone Matrix (Adoquines & Constellation Compass) -->
  <g fill="#1E2229">
    <!-- North Pointer (Arrow Accent) -->
    <polygon points="50,12 45,21 55,21" fill="#D94E36" />
    
    <!-- Cardinal Anchors (Outer Ring r=36) -->
    <circle cx="50" cy="27" r="3.2" fill="#D94E36" />
    <circle cx="86" cy="50" r="3.2" opacity="0.8" />
    <circle cx="50" cy="86" r="3.2" opacity="0.8" />
    <circle cx="14" cy="50" r="3.2" opacity="0.8" />
    
    <!-- Middle Ring (r=24) - 8 Points -->
    <circle cx="50" cy="38" r="2.4" />
    <circle cx="67" cy="33" r="2.2" opacity="0.5" />
    <circle cx="74" cy="50" r="2.8" opacity="0.8" />
    <circle cx="67" cy="67" r="2.2" opacity="0.5" />
    <circle cx="50" cy="74" r="2.8" opacity="0.8" />
    <circle cx="33" cy="67" r="2.2" opacity="0.5" />
    <circle cx="26" cy="50" r="2.8" opacity="0.8" />
    <circle cx="33" cy="33" r="2.2" opacity="0.5" />
    
    <!-- Inner Orbit Ring (r=14) - Fine Guide -->
    <circle cx="50" cy="50" r="14" fill="none" stroke="#1E2229" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.3" />
    
    <!-- Center Waypoint (The Nomad Presence) -->
    <circle cx="50" cy="50" r="8" fill="#FCFBFA" stroke="#1E2229" stroke-width="2.5" />
    <circle cx="50" cy="50" r="4" fill="#D94E36" />
  </g>
</svg>
