<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Concept 2: The Intersecting Calles (Latin American Grid & Waypoint Node) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Grid System (Calles & Carreras) -->
    <line x1="24" y1="36" x2="76" y2="36" stroke="#1E2229" stroke-width="3" opacity="0.35" />
    <line x1="18" y1="52" x2="82" y2="52" stroke="#1E2229" stroke-width="3.5" opacity="0.9" />
    <line x1="28" y1="68" x2="72" y2="68" stroke="#1E2229" stroke-width="3" opacity="0.35" />
    
    <line x1="36" y1="22" x2="36" y2="78" stroke="#1E2229" stroke-width="3" opacity="0.35" />
    <line x1="52" y1="18" x2="52" y2="82" stroke="#1E2229" stroke-width="3.5" opacity="0.9" />
    <line x1="68" y1="26" x2="68" y2="74" stroke="#1E2229" stroke-width="3" opacity="0.35" />
    
    <!-- Accent Intersection Diamond / Block -->
    <rect x="47" y="47" width="10" height="10" rx="2.5" fill="#FCFBFA" stroke="#1E2229" stroke-width="2.5" />
    
    <!-- Dynamic Waypoint at (52, 52) -->
    <circle cx="52" cy="52" r="3" fill="#D94E36" />
    
    <!-- Radar / Nomad Discovery Arc in Upper Right Quadrant -->
    <path d="M 52 30 A 22 22 0 0 1 74 52" fill="none" stroke="#D94E36" stroke-width="2" stroke-dasharray="3 3" />
    <circle cx="68" cy="36" r="3.5" fill="#D94E36" />
  </g>
</svg>
