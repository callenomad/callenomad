<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalleNomad — 6 Brand Logo Concepts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        .font-outfit { font-family: 'Outfit', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        .logo-card {
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .logo-card:hover {
            transform: translateY(-4px);
        }
        
        .logo-aura {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            transform: scale(0.6);
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            filter: blur(35px);
            pointer-events: none;
        }
        .logo-card:hover .logo-aura {
            transform: scale(1.1);
            opacity: 1;
        }

        .badge-pill {
            font-size: 0.68rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="bg-[#FCFBFA] text-[#1E2229]">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // SVG 1: The Faceted Waypoint
        const Logo1 = ({ theme }) => {
            const isDark = theme === 'dark' || theme === 'terracotta';
            const baseColor = isDark ? '#FFFFFF' : '#1E2229';
            const coral = '#D94E36';
            const centerBg = isDark ? (theme === 'terracotta' ? '#D94E36' : '#12151B') : '#FCFBFA';
            return (
                <svg viewBox="0 0 100 100" className="w-full h-full">
                    <polygon points="50,14 41,39 50,42" fill={baseColor} opacity="0.9" />
                    <polygon points="50,14 50,42 59,39" fill={coral} />
                    <polygon points="86,50 61,41 58,50" fill={baseColor} opacity="0.75" />
                    <polygon points="86,50 58,50 61,59" fill={baseColor} opacity="0.9" />
                    <polygon points="50,86 59,61 50,58" fill={baseColor} opacity="0.65" />
                    <polygon points="50,86 50,58 41,61" fill={baseColor} opacity="0.8" />
                    <polygon points="14,50 39,59 42,50" fill={baseColor} opacity="0.75" />
                    <polygon points="14,50 42,50 39,41" fill={baseColor} opacity="0.9" />
                    <circle cx="50" cy="50" r="14" fill="none" stroke={baseColor} strokeWidth="1.5" strokeDasharray="2 3" opacity="0.4" />
                    <circle cx="50" cy="50" r="6" fill={centerBg} stroke={baseColor} strokeWidth="2.5" />
                    <circle cx="50" cy="50" r="2.5" fill={coral} />
                </svg>
            );
        };

        // SVG 2: The Intersecting Calles
        const Logo2 = ({ theme }) => {
            const isDark = theme === 'dark' || theme === 'terracotta';
            const baseColor = isDark ? '#FFFFFF' : '#1E2229';
            const coral = theme === 'terracotta' ? '#FFFFFF' : '#D94E36';
            const centerBg = isDark ? (theme === 'terracotta' ? '#D94E36' : '#12151B') : '#FCFBFA';
            return (
                <svg viewBox="0 0 100 100" className="w-full h-full" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="24" y1="36" x2="76" y2="36" stroke={baseColor} strokeWidth="3" opacity="0.35" />
                    <line x1="18" y1="52" x2="82" y2="52" stroke={baseColor} strokeWidth="3.5" opacity="0.9" />
                    <line x1="28" y1="68" x2="72" y2="68" stroke={baseColor} strokeWidth="3" opacity="0.35" />
                    <line x1="36" y1="22" x2="36" y2="78" stroke={baseColor} strokeWidth="3" opacity="0.35" />
                    <line x1="52" y1="18" x2="52" y2="82" stroke={baseColor} strokeWidth="3.5" opacity="0.9" />
                    <line x1="68" y1="26" x2="68" y2="74" stroke={baseColor} strokeWidth="3" opacity="0.35" />
                    <rect x="47" y="47" width="10" height="10" rx="2.5" fill={centerBg} stroke={baseColor} strokeWidth="2.5" />
                    <circle cx="52" cy="52" r="3" fill={coral} />
                    <path d="M 52 30 A 22 22 0 0 1 74 52" fill="none" stroke={coral} strokeWidth="2" strokeDasharray="3 3" />
                    <circle cx="68" cy="36" r="3.5" fill={coral} />
                </svg>
            );
        };

        // SVG 3: The Continuous Calle
        const Logo3 = ({ theme }) => {
            const isDark = theme === 'dark' || theme === 'terracotta';
            const baseColor = isDark ? '#FFFFFF' : '#1E2229';
            const coral = theme === 'terracotta' ? '#FFE8E3' : '#D94E36';
            const dotFill = isDark ? (theme === 'terracotta' ? '#D94E36' : '#12151B') : '#FCFBFA';
            return (
                <svg viewBox="0 0 100 100" className="w-full h-full" strokeLinecap="round" strokeLinejoin="round" fill="none">
                    <path 
                      d="M 72 32 C 54 18, 24 24, 24 50 C 24 76, 54 82, 72 68 C 84 56, 78 38, 58 42 C 46 44, 42 56, 50 62 C 56 66, 64 64, 68 58" 
                      stroke={baseColor} 
                      strokeWidth="3.5" 
                    />
                    <circle cx="72" cy="32" r="2.5" fill={baseColor} stroke={dotFill} strokeWidth="1.5" />
                    <circle cx="68" cy="58" r="4.5" fill={coral} />
                    <circle cx="68" cy="58" r="1.5" fill={dotFill} />
                </svg>
            );
        };

        // SVG 4: The Cobblestone Matrix
        const Logo4 = ({ theme }) => {
            const isDark = theme === 'dark' || theme === 'terracotta';
            const baseColor = isDark ? '#FFFFFF' : '#1E2229';
            const coral = theme === 'terracotta' ? '#FFFFFF' : '#D94E36';
            const centerBg = isDark ? (theme === 'terracotta' ? '#D94E36' : '#12151B') : '#FCFBFA';
            return (
                <svg viewBox="0 0 100 100" className="w-full h-full" fill={baseColor}>
                    <polygon points="50,12 45,21 55,21" fill={coral} />
                    <circle cx="50" cy="27" r="3.2" fill={coral} />
                    <circle cx="86" cy="50" r="3.2" opacity="0.8" />
                    <circle cx="50" cy="86" r="3.2" opacity="0.8" />
                    <circle cx="14" cy="50" r="3.2" opacity="0.8" />
                    <circle cx="50" cy="38" r="2.4" />
                    <circle cx="67" cy="33" r="2.2" opacity="0.5" />
                    <circle cx="74" cy="50" r="2.8" opacity="0.8" />
                    <circle cx="67" cy="67" r="2.2" opacity="0.5" />
                    <circle cx="50" cy="74" r="2.8" opacity="0.8" />
                    <circle cx="33" cy="67" r="2.2" opacity="0.5" />
                    <circle cx="26" cy="50" r="2.8" opacity="0.8" />
                    <circle cx="33" cy="33" r="2.2" opacity="0.5" />
                    <circle cx="50" cy="50" r="14" fill="none" stroke={baseColor} strokeWidth="1.2" strokeDasharray="2 3" opacity="0.3" />
                    <circle cx="50" cy="50" r="8" fill={centerBg} stroke={baseColor} strokeWidth="2.5" />
                    <circle cx="50" cy="50" r="4" fill={coral} />
                </svg>
            );
        };

        // SVG 5: The Converging Horizons
        const Logo5 = ({ theme }) => {
            const isDark = theme === 'dark' || theme === 'terracotta';
            const baseColor = isDark ? '#FFFFFF' : '#1E2229';
            const coral = theme === 'terracotta' ? '#FFFFFF' : '#D94E36';
            const centerBg = isDark ? (theme === 'terracotta' ? '#D94E36' : '#12151B') : '#FCFBFA';
            return (
                <svg viewBox="0 0 100 100" className="w-full h-full" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M 22 72 C 22 42, 42 24, 68 24" fill="none" stroke={baseColor} strokeWidth="3.5" />
                    <path d="M 78 28 C 78 58, 58 76, 32 76" fill="none" stroke={baseColor} strokeWidth="3.5" opacity="0.85" />
                    <line x1="36" y1="64" x2="64" y2="36" stroke={coral} strokeWidth="2.5" strokeDasharray="3 3" />
                    <circle cx="22" cy="72" r="3.5" fill={baseColor} />
                    <circle cx="78" cy="28" r="3.5" fill={baseColor} />
                    <circle cx="50" cy="50" r="7" fill={centerBg} stroke={baseColor} strokeWidth="2.5" />
                    <circle cx="50" cy="50" r="3.5" fill={coral} />
                </svg>
            );
        };

        // SVG 6: The Waypoint Monogram
        const Logo6 = ({ theme }) => {
            const isDark = theme === 'dark' || theme === 'terracotta';
            const baseColor = isDark ? '#FFFFFF' : '#1E2229';
            const coral = theme === 'terracotta' ? '#FFE8E3' : '#D94E36';
            const centerBg = isDark ? (theme === 'terracotta' ? '#D94E36' : '#12151B') : '#FCFBFA';
            return (
                <svg viewBox="0 0 100 100" className="w-full h-full" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M 68 28 A 30 30 0 1 0 68 72" fill="none" stroke={baseColor} strokeWidth="4" />
                    <line x1="32" y1="68" x2="47" y2="53" stroke={baseColor} strokeWidth="3" />
                    <circle cx="50" cy="50" r="5" fill={centerBg} stroke={baseColor} strokeWidth="2.5" />
                    <line x1="53" y1="47" x2="78" y2="22" stroke={coral} strokeWidth="3" />
                    <polygon points="78,22 67,26 74,33" fill={coral} />
                    <circle cx="50" cy="50" r="1.8" fill={baseColor} />
                </svg>
            );
        };

        const logosData = [
            {
                id: 1,
                name: "The Faceted Waypoint",
                tagline: "Geometric Compass Rose with Negative Aperture",
                Component: Logo1,
                filename: "concept-1-faceted-waypoint.svg",
                concept: "Precision Wayfinding & True North",
                description: "A 4-point faceted compass star featuring a central negative void aperture. The North blade is finished in energetic Terracotta Coral, signaling the nomad's true conversational orientation. Evokes colonial plaza sundials with razor-sharp modern execution.",
                strengths: "Ultra-high authority, timeless luxury aesthetic, looks exceptional as an app icon or embossed collateral.",
                metrics: { balance: "100%", scalability: "96%", memorability: "94%" }
            },
            {
                id: 2,
                name: "The Intersecting Calles",
                tagline: "Urban Street Grid & Living Waypoint Beacon",
                Component: Logo2,
                filename: "concept-2-intersecting-calles.svg",
                concept: "Calles & Carreras Grid Navigation",
                description: "Directly honors the Latin American urban street plan (Calles and Carreras). Clean, rhythmic monoline grid paths intersect around a central coordinate block with a live Terracotta GPS sonar pulse in the active northeast sector.",
                strengths: "Deep thematic connection to 'Calle' (streets) and tech-nomad location independence.",
                metrics: { balance: "94%", scalability: "90%", memorability: "96%" }
            },
            {
                id: 3,
                name: "The Continuous Calle",
                tagline: "Monoline Infinity Flow & Conversational Path",
                Component: Logo3,
                filename: "concept-3-continuous-calle.svg",
                concept: "Frictionless Street Learning Journey",
                description: "A single continuous fluid path that draws an open 'C' (Calle) and sweeps inward into an adventurous nomad path ('N'). From the arrival node at top-right to the community fluency destination, it embodies conversational rhythm without dead-ends.",
                strengths: "Warm, approachable, friendly, human-centric. Removes the intimidating feeling of traditional grammar drills.",
                metrics: { balance: "92%", scalability: "93%", memorability: "95%" }
            },
            {
                id: 4,
                name: "The Cobblestone Matrix",
                tagline: "Radial Adoquines & Constellation Compass",
                Component: Logo4,
                filename: "concept-4-cobblestone-matrix.svg",
                concept: "Colonial Streets meet GPS Precision",
                description: "Disciplined radial dot geometry inspired by historical Latin American stone plazas ('adoquines') and modern GPS point clouds. Dots scale outwards with a north arrow pointer and a warm terracotta core anchor.",
                strengths: "Unique textural depth, tech-forward yet grounded in street-level physical reality.",
                metrics: { balance: "95%", scalability: "88%", memorability: "92%" }
            },
            {
                id: 5,
                name: "The Converging Horizons",
                tagline: "Bilateral Arcs & The Immersion Bridge",
                Component: Logo5,
                filename: "concept-5-converging-horizons.svg",
                concept: "Human Connection & Cultural Exchange",
                description: "Two architectural arcs—one representing the arriving nomad, the other representing the local community—converging at a shared tangent along a dashed bridge axis. Where they connect, conversational fluency unlocks.",
                strengths: "Poetic brand story, highly dynamic motion, perfectly balanced weight distribution.",
                metrics: { balance: "96%", scalability: "94%", memorability: "91%" }
            },
            {
                id: 6,
                name: "The Waypoint Monogram",
                tagline: "The 'C' Arc + Northeast Nomad Compass Needle",
                Component: Logo6,
                filename: "concept-6-waypoint-monogram.svg",
                concept: "Minimalist Brand Icon: C + Nomad Vector",
                description: "A pure geometric powerhouse. An open circular 'C' (Calle) pierced diagonally by a 45° compass needle pointing toward the northeast horizon (Nomad trajectory). The diagonal cross-vector also forms an implied 'N', creating an effortless 'CN' monogram.",
                strengths: "Flawless scalability from 16px favicon to giant billboards; instant silhouette recognition.",
                metrics: { balance: "98%", scalability: "99%", memorability: "98%" }
            }
        ];

        const App = () => {
            const [theme, setTheme] = useState('sand'); // 'sand', 'dark', 'terracotta', 'white'
            const [copiedId, setCopiedId] = useState(null);

            const themeStyles = {
                sand: { bg: 'bg-[#FCFBFA]', card: 'bg-[#F4F1EA]', text: 'text-[#1E2229]', border: 'border-[#E6E1D6]' },
                dark: { bg: 'bg-[#12151B]', card: 'bg-[#1B202A]', text: 'text-white', border: 'border-[#2C3342]' },
                terracotta: { bg: 'bg-[#C8432C]', card: 'bg-[#D94E36]', text: 'text-white', border: 'border-[#E56A55]' },
                white: { bg: 'bg-white', card: 'bg-[#F8FAFC]', text: 'text-[#0F172A]', border: 'border-[#E2E8F0]' }
            };

            const current = themeStyles[theme];

            const copySvg = async (filename, id) => {
                try {
                    const res = await fetch(`logos/${filename}`);
                    const text = await res.text();
                    await navigator.clipboard.writeText(text);
                    setCopiedId(id);
                    setTimeout(() => setCopiedId(null), 2000);
                } catch (e) {
                    alert("Could not access file directly via clipboard; right-click and save SVG from logos directory.");
                }
            };

            return (
                <div className={`min-h-screen ${current.bg} ${current.text} transition-colors duration-300 pb-28`}>
                    
                    {/* Top Navigation & Theme Switcher */}
                    <header className="sticky top-0 z-50 backdrop-blur-md bg-opacity-80 border-b border-inherit px-6 py-4">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 rounded-lg bg-[#D94E36] flex items-center justify-center text-white font-outfit font-bold text-sm shadow-sm">
                                    CN
                                </div>
                                <div>
                                    <h1 className="font-outfit font-bold text-lg tracking-tight">CalleNomad</h1>
                                    <p className="text-xs opacity-60 font-mono">Brand Identity Exploration</p>
                                </div>
                            </div>

                            {/* Theme Switcher Bar */}
                            <div className="flex items-center gap-1.5 p-1 rounded-full border border-inherit bg-black/5 dark:bg-white/5 text-xs font-medium">
                                <button 
                                    onClick={() => setTheme('sand')}
                                    className={`px-3 py-1.5 rounded-full transition-all flex items-center gap-1.5 ${theme === 'sand' ? 'bg-[#F4F1EA] text-[#1E2229] shadow-sm font-semibold' : 'opacity-70 hover:opacity-100'}`}
                                >
                                    <span className="w-2.5 h-2.5 rounded-full bg-[#F4F1EA] border border-[#D5CFC5]"></span>
                                    Warm Sand
                                </button>
                                <button 
                                    onClick={() => setTheme('dark')}
                                    className={`px-3 py-1.5 rounded-full transition-all flex items-center gap-1.5 ${theme === 'dark' ? 'bg-[#1B202A] text-white shadow-sm font-semibold' : 'opacity-70 hover:opacity-100'}`}
                                >
                                    <span className="w-2.5 h-2.5 rounded-full bg-[#12151B] border border-white/20"></span>
                                    Deep Charcoal
                                </button>
                                <button 
                                    onClick={() => setTheme('terracotta')}
                                    className={`px-3 py-1.5 rounded-full transition-all flex items-center gap-1.5 ${theme === 'terracotta' ? 'bg-white text-[#D94E36] shadow-sm font-semibold' : 'opacity-70 hover:opacity-100'}`}
                                >
                                    <span className="w-2.5 h-2.5 rounded-full bg-[#D94E36]"></span>
                                    Terracotta
                                </button>
                                <button 
                                    onClick={() => setTheme('white')}
                                    className={`px-3 py-1.5 rounded-full transition-all flex items-center gap-1.5 ${theme === 'white' ? 'bg-white text-[#0F172A] shadow-sm font-semibold border border-gray-200' : 'opacity-70 hover:opacity-100'}`}
                                >
                                    <span className="w-2.5 h-2.5 rounded-full bg-white border border-gray-400"></span>
                                    Clean White
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Hero Section */}
                    <div className="max-w-4xl mx-auto text-center pt-16 pb-12 px-6">
                        <span className="badge-pill inline-block px-3 py-1 rounded-full font-mono font-medium tracking-widest uppercase bg-[#D94E36]/10 text-[#D94E36] mb-4">
                            Vector Design System — 6 Concepts
                        </span>
                        <h2 className="text-4xl sm:text-5xl font-outfit font-extrabold tracking-tight mb-4">
                            Brand Identity for Street Spanish
                        </h2>
                        <p className="text-base sm:text-lg opacity-75 max-w-2xl mx-auto leading-relaxed font-light">
                            Each concept fuses <strong>wayfinding & compass geometry</strong> ("Nomad") with <strong>street navigation & conversational flow</strong> ("Calle"), crafted with high-precision vector lines and balanced negative space.
                        </p>
                    </div>

                    {/* 6 Logo Cards Grid */}
                    <div className="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        {logosData.map((logo) => (
                            <div 
                                key={logo.id} 
                                className={`logo-card rounded-2xl p-7 border ${current.card} ${current.border} shadow-sm hover:shadow-xl flex flex-col justify-between`}
                            >
                                <div>
                                    {/* Concept Number & Tag */}
                                    <div className="flex items-center justify-between mb-4">
                                        <span className="font-mono text-xs opacity-50 tracking-wider">
                                            CONCEPT 0{logo.id}
                                        </span>
                                        <span className="text-[11px] font-mono px-2 py-0.5 rounded bg-black/5 dark:bg-white/10 opacity-80">
                                            viewBox 0 0 100 100
                                        </span>
                                    </div>

                                    {/* Canvas Visual Area */}
                                    <div className="w-full h-56 rounded-xl flex items-center justify-center relative overflow-hidden bg-black/[0.02] dark:bg-white/[0.02] border border-inherit/40 mb-6 group">
                                        <div className="logo-aura bg-[#D94E36]/20"></div>
                                        <div className="w-28 h-28 relative z-10 transition-transform duration-500 group-hover:scale-110">
                                            <logo.Component theme={theme} />
                                        </div>
                                    </div>

                                    {/* Title & Concept */}
                                    <h3 className="font-outfit font-bold text-xl tracking-tight mb-1">
                                        {logo.name}
                                    </h3>
                                    <p className="font-mono text-xs text-[#D94E36] mb-4 font-medium">
                                        {logo.tagline}
                                    </p>
                                    <p className="text-xs sm:text-sm leading-relaxed opacity-80 mb-5 font-light">
                                        {logo.description}
                                    </p>

                                    {/* Wordmark Lockup Preview */}
                                    <div className="pt-4 border-t border-inherit/50 mb-5">
                                        <p className="text-[10px] font-mono uppercase tracking-wider opacity-50 mb-2">Wordmark Lockup (Outfit)</p>
                                        <div className="flex items-center gap-3 p-2.5 rounded-lg bg-black/5 dark:bg-white/5 border border-inherit/40">
                                            <div className="w-7 h-7 flex-shrink-0">
                                                <logo.Component theme={theme} />
                                            </div>
                                            <div className="font-outfit font-extrabold text-base tracking-tight leading-none">
                                                Calle<span className="text-[#D94E36]">Nomad</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Favicon & Mobile Scale Test */}
                                    <div className="mb-5">
                                        <p className="text-[10px] font-mono uppercase tracking-wider opacity-50 mb-2">Scalability Test (32px & 16px)</p>
                                        <div className="flex items-center gap-4 p-2 rounded-lg bg-black/5 dark:bg-white/5 border border-inherit/40">
                                            <div className="flex items-center gap-2">
                                                <div className="w-8 h-8 p-1 rounded bg-black/5 dark:bg-white/10 flex items-center justify-center">
                                                    <div className="w-6 h-6"><logo.Component theme={theme} /></div>
                                                </div>
                                                <span className="text-[10px] font-mono opacity-60">32px</span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <div className="w-6 h-6 p-0.5 rounded bg-black/5 dark:bg-white/10 flex items-center justify-center">
                                                    <div className="w-4 h-4"><logo.Component theme={theme} /></div>
                                                </div>
                                                <span className="text-[10px] font-mono opacity-60">16px</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Metrics */}
                                    <div className="grid grid-cols-3 gap-2 text-center pt-3 border-t border-inherit/50 mb-5">
                                        <div className="p-1.5 rounded bg-black/5 dark:bg-white/5">
                                            <div className="text-[9px] font-mono opacity-60 uppercase">Balance</div>
                                            <div className="font-bold text-xs font-mono">{logo.metrics.balance}</div>
                                        </div>
                                        <div className="p-1.5 rounded bg-black/5 dark:bg-white/5">
                                            <div className="text-[9px] font-mono opacity-60 uppercase">Scale</div>
                                            <div className="font-bold text-xs font-mono">{logo.metrics.scalability}</div>
                                        </div>
                                        <div className="p-1.5 rounded bg-black/5 dark:bg-white/5">
                                            <div className="text-[9px] font-mono opacity-60 uppercase">Memory</div>
                                            <div className="font-bold text-xs font-mono">{logo.metrics.memorability}</div>
                                        </div>
                                    </div>
                                </div>

                                {/* Action Buttons */}
                                <div className="flex items-center gap-2 pt-2">
                                    <button 
                                        onClick={() => copySvg(logo.filename, logo.id)}
                                        className="flex-1 py-2 px-3 rounded-lg text-xs font-semibold bg-[#D94E36] hover:bg-[#c23f28] text-white transition-all text-center flex items-center justify-center gap-1.5 shadow-sm"
                                    >
                                        {copiedId === logo.id ? (
                                            <>
                                                <span>✓</span> Copied Code!
                                            </>
                                        ) : (
                                            <>
                                                <span>📋</span> Copy SVG
                                            </>
                                        )}
                                    </button>
                                    <a 
                                        href={`logos/${logo.filename}`} 
                                        download={logo.filename}
                                        className="py-2 px-3 rounded-lg text-xs font-semibold border border-inherit hover:bg-black/5 dark:hover:bg-white/10 transition-all flex items-center justify-center"
                                        title="Download Standalone SVG File"
                                    >
                                        ⬇
                                    </a>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Side-by-Side Quick Comparison Bar */}
                    <div className="max-w-7xl mx-auto px-6 mt-20">
                        <div className={`p-8 rounded-2xl border ${current.card} ${current.border}`}>
                            <h3 className="font-outfit font-bold text-xl mb-2 text-center">
                                Side-by-Side Horizontal Comparison
                            </h3>
                            <p className="text-xs font-mono opacity-60 text-center mb-8 uppercase tracking-widest">
                                Immediate Visual Impact Check
                            </p>
                            
                            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-6 items-center">
                                {logosData.map((logo) => (
                                    <div key={logo.id} className="flex flex-col items-center text-center p-4 rounded-xl bg-black/5 dark:bg-white/5 hover:scale-105 transition-transform cursor-pointer">
                                        <div className="w-16 h-16 mb-3">
                                            <logo.Component theme={theme} />
                                        </div>
                                        <span className="font-outfit font-bold text-xs">Concept 0{logo.id}</span>
                                        <span className="text-[10px] opacity-60 font-mono mt-0.5">{logo.name.split(' ')[1] || logo.name}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Footer Guidance */}
                    <div className="max-w-2xl mx-auto text-center mt-20 px-6">
                        <p className="font-mono text-xs opacity-50 uppercase tracking-widest leading-relaxed">
                            CalleNomad Vector Identity System<br />
                            Generated via Antigravity & Logo Generator Skill
                        </p>
                    </div>

                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
