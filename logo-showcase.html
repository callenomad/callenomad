                                            <div className="flex items-center gap-3 p-2 rounded-lg bg-black/5 dark:bg-white/5 border border-inherit/40">
                                                <div className="w-7 h-7 p-0.5 rounded bg-black/5 dark:bg-white/10 flex items-center justify-center">
                                                    <div className="w-5 h-5"><item.Component theme={theme} /></div>
                                                </div>
                                                <span className="text-[10px] font-mono opacity-60">24px</span>
                                                <div className="w-5 h-5 p-0.5 rounded bg-black/5 dark:bg-white/10 flex items-center justify-center">
                                                    <div className="w-3.5 h-3.5"><item.Component theme={theme} /></div>
                                                </div>
                                                <span className="text-[10px] font-mono opacity-60">16px</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Action Buttons */}
                                    <div className="flex items-center gap-2 pt-2 border-t border-inherit/50">
                                        <button 
                                            onClick={() => copySvg(item.filename, item.id)}
                                            className="flex-1 py-1.5 px-3 rounded-lg text-xs font-semibold bg-[#D94E36] hover:bg-[#c23f28] text-white transition-all text-center flex items-center justify-center gap-1 shadow-sm"
                                        >
                                            {copiedId === item.id ? "✓ Copied!" : "📋 Copy SVG"}
                                        </button>
                                        <a 
                                            href={`logos/${item.filename}`} 
                                            download={item.filename}
                                            className="py-1.5 px-2.5 rounded-lg text-xs font-semibold border border-inherit hover:bg-black/5 dark:hover:bg-white/10 transition-all flex items-center justify-center"
                                            title="Download SVG"
                                        >
                                            ⬇
                                        </a>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Section 2: Other Concept Alternatives */}
                    <div className="max-w-7xl mx-auto px-6 mt-24">
                        <div className={`p-8 rounded-2xl border ${current.card} ${current.border}`}>
                            <h3 className="font-outfit font-bold text-xl mb-1 text-center">
                                Previous Concepts (01 – 05) For Reference
                            </h3>
                            <p className="text-xs font-mono opacity-60 text-center mb-8 uppercase tracking-widest">
                                Full Exploration History Preserved
                            </p>
                            
                            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-6">
                                {otherConcepts.map((item) => (
                                    <div key={item.id} className="flex flex-col items-center text-center p-4 rounded-xl bg-black/5 dark:bg-white/5 hover:scale-105 transition-transform">
                                        <div className="w-16 h-16 mb-3">
                                            <item.Component theme={theme} />
                                        </div>
                                        <span className="font-outfit font-bold text-xs">Concept 0{item.id}</span>
                                        <span className="text-[10px] opacity-60 font-mono mt-0.5">{item.name}</span>
                                        <a 
                                            href={`logos/${item.filename}`} 
                                            download={item.filename}
                                            className="mt-3 text-[10px] font-mono text-[#D94E36] hover:underline"
                                        >
                                            Download ⬇
                                        </a>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Footer */}
                    <div className="max-w-2xl mx-auto text-center mt-20 px-6">
                        <p className="font-mono text-xs opacity-50 uppercase tracking-widest leading-relaxed">
                            CalleNomad Vector Identity System<br />
                            Generated via Antigravity & Logo Generator Skill
                        </p>
                    </div>

                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
